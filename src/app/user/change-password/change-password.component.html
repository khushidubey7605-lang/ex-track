<div class="password-container">
  <h2>Change Password</h2>

  <form #pwdForm="ngForm" (ngSubmit)="changePassword()">

    <!-- Current Password -->
    <div class="form-group">
      <label for="currentPassword">Current Password</label>
      <input
        type="password"
        id="currentPassword"
        name="currentPassword"
        [(ngModel)]="currentPassword"
        required
        minlength="6"
        placeholder="Enter current password"
      />
    </div>

    <!-- New Password -->
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input
        type="password"
        id="newPassword"
        name="newPassword"
        [(ngModel)]="newPassword"
        required
        minlength="6"
        placeholder="Enter new password"
      />
      <small class="hint">Password must be at least 6 characters</small>
    </div>

    <!-- Confirm Password -->
    <div class="form-group">
      <label for="confirmPassword">Confirm New Password</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        required
        minlength="6"
        placeholder="Re-enter new password"
      />
    </div>

    <!-- Submit Button -->
    <button type="submit" [disabled]="!pwdForm.valid">
      Update Password
    </button>

    <!-- Messages -->
    <p class="success" *ngIf="successMessage">
      {{ successMessage }}
    </p>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </form>
</div>
