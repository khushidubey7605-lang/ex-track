<div class="sidenav-container">
  <nav class="sidenav">

    <!-- TOP -->
    <div class="sidenav-top">

      <!-- LOGO -->
      <div class="sidenav-logo">
        <div class="logo-circle">
          {{ username?.charAt(0)?.toUpperCase() || 'U' }}
        </div>
        <span class="logo-text">ExpenseTracker</span>
      </div>

      <!-- LINKS -->
      <ul class="sidenav-links">
        <li><a routerLink="/dashboard" routerLinkActive="active">Dashboard</a></li>
        <li><a routerLink="/expenses" routerLinkActive="active">Expenses</a></li>
        <li><a routerLink="/income" routerLinkActive="active">Income</a></li>
        <li><a routerLink="/reports" routerLinkActive="active">Reports</a></li>
        <li><a routerLink="/profile" routerLinkActive="active">Profile</a></li>
      </ul>

    </div>

    <!-- BOTTOM -->
    <button
      class="logout-btn"
      [class.active]="isLogoutActive"
      (click)="logout()">
      Logout
    </button>

  </nav>
</div>
