<div class="income-wrapper">

  <!-- Income Form -->
  <form (ngSubmit)="save()" #incomeForm="ngForm" class="income-form">

    <div class="form-group">
      <label>Title</label>
      <input type="text" name="title" [(ngModel)]="data.title" placeholder="Eg: Salary" required />
    </div>

    <div class="form-group">
      <label>Amount</label>
      <input type="number" name="amount" [(ngModel)]="data.amount" placeholder="Eg: 5000" required />
    </div>

    <div class="form-group">
      <label>Category</label>
      <input type="text" name="category" [(ngModel)]="data.category" placeholder="Eg: Salary / Bonus" required />
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="date" name="date" [(ngModel)]="data.date" required />
    </div>

    <button type="submit">{{ data.id ? 'Update Income' : 'Add Income' }}</button>
  </form>

  <!-- Income List -->
  <div class="income-list">
    <h3>Your Income</h3>
    <div *ngIf="transactions.length === 0">No income added yet.</div>

    <div class="income-item" *ngFor="let item of transactions">
      <div>
        <strong>{{ item.title }}</strong> - {{ item.amount | currency }} - {{ item.category }} - {{ item.date }}
      </div>
      <div class="actions">
        <button type="button" (click)="editIncome(item)">Edit</button>
        <button type="button" (click)="deleteIncome(item)">Delete</button>
      </div>
    </div>
  </div>
</div>
