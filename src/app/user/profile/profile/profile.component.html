<div class="profile-container">
  <h2>User Profile</h2>
  <p class="subtitle">View and update your profile details</p>

  <!-- Success Message -->
  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

  <form #profileForm="ngForm" (ngSubmit)="updateProfile()">

    <!-- Full Name -->
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" [(ngModel)]="user.name" required />
    </div>

    <!-- Email (readonly) -->
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" [(ngModel)]="user.email" readonly />
    </div>

    <!-- Username -->
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" [(ngModel)]="user.username" required />
    </div>

    <!-- Phone -->
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" name="phone" [(ngModel)]="user.phone" required />
    </div>

    <!-- Submit Button -->
    <button type="submit" [disabled]="profileForm.invalid || loading">
      {{ loading ? 'Saving...' : 'Update Profile' }}
    </button>
  </form>
</div>

<style>
.profile-container {
  max-width: 500px;
  margin: 20px auto;
  padding: 20px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background-color: #f9f9f9;
}
.form-group {
  margin-bottom: 15px;
}
input {
  width: 100%;
  padding: 8px;
  box-sizing: border-box;
}
button {
  padding: 10px 20px;
  cursor: pointer;
}
.success {
  color: green;
  font-weight: bold;
  margin-bottom: 10px;
}
.subtitle {
  color: #555;
  margin-bottom: 20px;
}
</style>
