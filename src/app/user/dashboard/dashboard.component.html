<div class="dashboard p-6 max-w-4xl mx-auto">

  <h1 class="text-2xl font-bold mb-6">Dashboard</h1>

  <!-- Totals -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
    <div class="p-4 border rounded shadow border-l-4 border-green-500">
      <p class="text-gray-500">Total Income</p>
      <p class="text-xl font-semibold">₹{{ totalIncome }}</p>
    </div>
    <div class="p-4 border rounded shadow border-l-4 border-red-500">
      <p class="text-gray-500">Total Expense</p>
      <p class="text-xl font-semibold">₹{{ totalExpense }}</p>
    </div>
    <div class="p-4 border rounded shadow border-l-4 border-blue-500">
      <p class="text-gray-500">Balance</p>
      <p class="text-xl font-semibold">₹{{ totalIncome - totalExpense }}</p>
    </div>
  </div>

  <!-- Recent Transactions -->
  <div>
    <h2 class="text-lg font-semibold mb-2">Recent Activity</h2>
    <ul class="divide-y divide-gray-200">
      <li *ngFor="let tx of transactions | slice:0:5" class="py-2 flex justify-between">
        <div>
          <p class="font-medium">{{ tx.title }}</p>
          <p class="text-gray-500 text-sm">{{ tx.date | date:'short' }}</p>
        </div>
        <div [ngClass]="tx.type === 'income' ? 'text-green-500' : 'text-red-500'">
          ₹{{ tx.amount }}
        </div>
      </li>
      <li *ngIf="transactions.length === 0" class="py-2 text-center text-gray-400">
        No transactions yet
      </li>
    </ul>
  </div>

</div>
